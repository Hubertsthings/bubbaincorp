<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huss Valley</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0e1f16;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Tunables ----------
  const ZONE = 90;                 // width of start / finish zones
  const R = 14;                    // body radius
  const PLAYER_SPEED = 240;        // human runner speed (px/s)
  const DASH_SPEED = 820;          // human dash speed
  const AI_DASH_SPEED = 660;       // bot dash speed (a bit weaker)
  const DASH_TIME = 0.13;          // seconds
  const DASH_COOLDOWN = 3;         // seconds (humans)
  const BOT_MAX = 460;
  const CATCH_DIST = R * 2 - 4;    // slightly forgiving
  const EXTRA_BOTS = 5;            // extra runner bots in "multiple bots" mode
  const FONT = '"Trebuchet MS", sans-serif';

  // ---------- Game state ----------
  let screen = 'menu';             // 'menu' | 'game'
  const cfg = { players: 1, multi: false };

  let ents = [];
  let trail = [];
  let level = 0;
  let score = 0;                   // runner points (P1 crossings)
  let chaserPts = 0;               // P2 tags (2-player only)
  let convertedBots = 0;           // bot runners tagged so far; they start later rounds as chasers
  let phase = 'ready';             // 'ready' | 'play' | 'caught'
  let phaseT = 0;
  let flash = 0;
  let hintT = 0;
  let endTimer = null;
  let notice = { text: '', t: 0, color: '#fff' };
  let board = [];
  const mouse = { x: -1, y: -1 };

  const rand = (a, b) => a + Math.random() * (b - a);
  const b2n = v => (v ? 1 : 0);

  // ---------- Leaderboard storage (solo only) ----------
  function boardKey() {
    return cfg.multi ? 'hussValleyLeaderboardMulti' : 'hussValleyLeaderboard';
  }
  function loadBoard() {
    try {
      const raw = localStorage.getItem(boardKey());
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(n => typeof n === 'number').slice(0, 5) : [];
    } catch (e) { return []; }
  }
  function saveBoard() {
    try { localStorage.setItem(boardKey(), JSON.stringify(board)); } catch (e) {}
  }
  function recordRun() {
    if (cfg.players === 1 && score > 0) {
      board.push(score);
      board.sort((a, b) => b - a);
      board = board.slice(0, 5);
      saveBoard();
    }
  }

  function botSpeed() {
    const base = cfg.multi ? 130 : 100;
    const step = cfg.multi ? 16 : 15;
    return Math.min(BOT_MAX, base + level * step);
  }

  function notify(text, color, secs) {
    notice = { text, color: color || '#fff', t: secs || 2 };
  }

  // ---------- Entities ----------
  function mk(ctrl, role, label, x, y) {
    return {
      ctrl, role, label, x, y,
      fx: 1, fy: 0,
      dashLeft: 0, dirX: 1, dirY: 0,
      cd: 0,
      aiTimer: rand(4, 6),
      finished: false,
      settleX: 0,
      tagFlash: 0,
      speedMul: rand(0.84, 0.98),
      laneY: rand(50, H - 50)
    };
  }

  function buildEntities() {
    ents = [];
    const converted = cfg.multi ? convertedBots : 0;
    if (cfg.multi) {
      // Bots tagged in earlier rounds have joined the chasers, so fewer runners remain.
      const total = EXTRA_BOTS - converted + 1;
      if (total === 1) {
        ents.push(mk('p1', 'runner', 'P1', ZONE / 2, H / 2));
      } else {
        const lo = Math.floor((total - 1) / 2), hi = Math.floor(total / 2);
        const p1Slot = Math.random() < 0.5 ? lo : hi;
        for (let i = 0; i < total; i++) {
          const y = 70 + i * (H - 140) / (total - 1);
          if (i === p1Slot) ents.push(mk('p1', 'runner', 'P1', ZONE / 2, y));
          else ents.push(mk('ai', 'runner', '', ZONE / 2 + rand(-12, 12), y));
        }
      }
    } else {
      ents.push(mk('p1', 'runner', 'P1', ZONE / 2, H / 2));
    }
    const ch = cfg.players === 2 ? mk('p2', 'chaser', 'P2', W / 2, H / 2)
                                 : mk('ai', 'chaser', '', W / 2, H / 2);
    ch.fx = -1;
    ents.push(ch);
    // Converted bots start next to the original chaser, on its team.
    for (let k = 0; k < converted; k++) {
      const side = k % 2 === 0 ? 1 : -1;
      const step = Math.floor(k / 2) + 1;
      const c = mk('ai', 'chaser', '', W / 2 + rand(-14, 14), H / 2 + side * step * 46);
      c.fx = -1;
      ents.push(c);
    }
  }

  function resetRound() {
    buildEntities();
    trail = [];
    endTimer = null;
    phase = 'ready';
    phaseT = 1.0;
  }

  function fullRestart() {
    level = 0;
    convertedBots = 0;                  // game over: every bot is a runner again
    if (cfg.players === 1) score = 0;   // solo resets; versus keeps match score
    resetRound();
  }

  function startGame() {
    board = loadBoard();
    level = 0; score = 0; chaserPts = 0; convertedBots = 0;
    flash = 0; hintT = 8; notice.t = 0;
    screen = 'game';
    clearKeys();
    resetRound();
  }

  function goMenu() {
    screen = 'menu';
    clearKeys();
  }

  // ---------- Input ----------
  const keys = { w: false, a: false, s: false, d: false, up: false, left: false, down: false, right: false };
  const keyMap = {
    KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd',
    ArrowUp: 'up', ArrowLeft: 'left', ArrowDown: 'down', ArrowRight: 'right'
  };
  function clearKeys() { for (const k in keys) keys[k] = false; }

  window.addEventListener('keydown', e => {
    if (screen === 'menu') {
      if (e.code === 'Enter' || e.code === 'Space') { startGame(); e.preventDefault(); }
      return;
    }
    if (e.code === 'Escape') { goMenu(); e.preventDefault(); return; }
    if (keyMap[e.code]) { keys[keyMap[e.code]] = true; e.preventDefault(); }
    if (!e.repeat) {
      if (e.code === 'KeyE') { tryDash('p1'); e.preventDefault(); }
      if (cfg.players === 2 && (e.code === 'Enter' || e.code === 'ShiftRight')) {
        tryDash('p2'); e.preventDefault();
      }
    }
  });
  window.addEventListener('keyup', e => {
    if (keyMap[e.code]) keys[keyMap[e.code]] = false;
  });
  window.addEventListener('blur', clearKeys);

  function canvasPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

  const BACK_BTN = { x: 10, y: 10, w: 76, h: 26 };

  window.addEventListener('mousemove', e => {
    const p = canvasPos(e);
    mouse.x = p.x; mouse.y = p.y;
    let hover = false;
    if (screen === 'menu') hover = menuButtons().some(b => inRect(p, b));
    else hover = inRect(p, BACK_BTN);
    canvas.style.cursor = hover ? 'pointer' : (screen === 'game' ? 'crosshair' : 'default');
  });

  window.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    const p = canvasPos(e);
    mouse.x = p.x; mouse.y = p.y;
    if (screen === 'menu') {
      for (const b of menuButtons()) {
        if (inRect(p, b)) { onMenuClick(b.id); break; }
      }
      e.preventDefault();
      return;
    }
    if (inRect(p, BACK_BTN)) { goMenu(); e.preventDefault(); return; }
    tryDash('p1');
    e.preventDefault();
  });

  function inputVec(ctrl) {
    let dx, dy;
    if (ctrl === 'p1') {
      dx = b2n(keys.d) - b2n(keys.a);
      dy = b2n(keys.s) - b2n(keys.w);
    } else {
      dx = b2n(keys.right) - b2n(keys.left);
      dy = b2n(keys.down) - b2n(keys.up);
    }
    const len = Math.hypot(dx, dy);
    if (len > 0) { dx /= len; dy /= len; }
    return { dx, dy };
  }

  function startDash(e, dx, dy) {
    e.dirX = dx; e.dirY = dy;
    e.dashLeft = DASH_TIME;
  }

  function tryDash(ctrl) {
    if (screen !== 'game' || phase !== 'play') return;
    const e = ents.find(x => x.ctrl === ctrl);
    if (!e || e.finished || e.cd > 0 || e.dashLeft > 0) return;
    const { dx, dy } = inputVec(ctrl);
    if (dx !== 0 || dy !== 0) startDash(e, dx, dy);
    else startDash(e, e.fx, e.fy);
    e.cd = DASH_COOLDOWN;
  }

  // ---------- Menu ----------
  function menuButtons() {
    return [
      { id: 'one', x: W / 2 - 210, y: 200, w: 200, h: 50, label: '1 PLAYER', sel: cfg.players === 1 },
      { id: 'two', x: W / 2 + 10, y: 200, w: 200, h: 50, label: 'MULTIPLAYER', sel: cfg.players === 2 },
      { id: 'multi', x: W / 2 - 210, y: 266, w: 420, h: 46, label: 'MULTIPLE BOTS: ' + (cfg.multi ? 'ON' : 'OFF'), sel: cfg.multi },
      { id: 'start', x: W / 2 - 210, y: 332, w: 420, h: 60, label: 'START GAME', primary: true }
    ];
  }

  function onMenuClick(id) {
    if (id === 'one') cfg.players = 1;
    else if (id === 'two') cfg.players = 2;
    else if (id === 'multi') cfg.multi = !cfg.multi;
    else if (id === 'start') startGame();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawButton(b) {
    const hover = inRect(mouse, b);
    let fill, stroke, text = '#fff';
    if (b.primary) { fill = hover ? '#43c75a' : '#2fa845'; stroke = '#b9f5c3'; }
    else if (b.sel) { fill = hover ? '#2e8cff' : '#1f74e0'; stroke = '#bfe0ff'; }
    else { fill = hover ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.1)'; stroke = 'rgba(255,255,255,0.45)'; }
    ctx.fillStyle = fill;
    roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke();
    ctx.fillStyle = text;
    ctx.font = 'bold ' + (b.primary ? 24 : 18) + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.textBaseline = 'alphabetic';
  }

  function drawMenu() {
    ctx.drawImage(grass, 0, 0);
    ctx.fillStyle = 'rgba(5, 25, 10, 0.62)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 66px ' + FONT;
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText('HUSS VALLEY', W / 2, 120);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('HUSS VALLEY', W / 2, 120);
    ctx.font = '17px ' + FONT;
    ctx.fillStyle = '#c8f5cf';
    ctx.fillText('Cross the valley. Don\u2019t get caught.', W / 2, 155);

    // little preview models
    const cyan = { x: W / 2 - 300, y: 120 };
    const red = { x: W / 2 + 300, y: 120 };
    drawBodyRaw(cyan.x, cyan.y, '#00e5ff', '#007c8a', 1, 0);
    drawBodyRaw(red.x, red.y, '#e53935', '#7f0f0f', -1, 0);

    for (const b of menuButtons()) drawButton(b);

    // info text
    ctx.font = '15px ' + FONT;
    ctx.fillStyle = '#ffffff';
    const lines = [];
    if (cfg.players === 1) {
      lines.push('You run: WASD to move, Left click or E to dash.');
    } else {
      lines.push('P1 (runner): WASD + E / Left click to dash.');
      lines.push('P2 (chaser): Arrow keys + Enter / Right Shift to dash.');
    }
    if (cfg.multi) {
      lines.push('5 extra bot runners join in. Anyone who gets tagged becomes a chaser!');
    } else {
      lines.push('Reach the FINISH side. The chaser gets faster every time you cross.');
    }
    lines.forEach((t, i) => ctx.fillText(t, W / 2, 428 + i * 22));
    ctx.font = '13px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('Press Enter to start  \u2022  Esc returns here during a game', W / 2, H - 22);
  }

  // ---------- Grass background (pre-rendered) ----------
  const grass = document.createElement('canvas');
  grass.width = W; grass.height = H;
  (function paintGrass() {
    const g = grass.getContext('2d');
    const stripe = 60;
    for (let x = 0; x < W; x += stripe) {
      g.fillStyle = ((x / stripe) % 2 === 0) ? '#3f9b45' : '#47a94d';
      g.fillRect(x, 0, stripe, H);
    }
    for (let i = 0; i < 2600; i++) {
      const x = Math.random() * W, y = Math.random() * H;
      const h = 3 + Math.random() * 5;
      g.strokeStyle = Math.random() < 0.5 ? 'rgba(20,90,30,0.35)' : 'rgba(150,230,120,0.28)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + (Math.random() - 0.5) * 3, y - h);
      g.stroke();
    }
    const colors = ['#fff6a8', '#ffffff', '#ffb3d1'];
    for (let i = 0; i < 40; i++) {
      const x = ZONE + 10 + Math.random() * (W - ZONE * 2 - 20);
      const y = 10 + Math.random() * (H - 20);
      g.fillStyle = colors[i % colors.length];
      g.beginPath(); g.arc(x, y, 1.8, 0, Math.PI * 2); g.fill();
    }
  })();

  // ---------- AI ----------
  function nearestRunner(e) {
    let best = null, bd = Infinity;
    for (const r of ents) {
      if (r.role !== 'runner' || r.finished) continue;
      const d = Math.hypot(r.x - e.x, r.y - e.y);
      if (d < bd) { bd = d; best = r; }
    }
    return best ? { r: best, d: bd } : null;
  }

  // Runner bots: head for the finish, steer away from chasers (circling around them
  // toward the finish side), and keep off the walls.
  function runnerSteer(e) {
    let gx = (W - ZONE / 2) - e.x;
    let gy = (e.laneY - e.y) * 0.5;
    const gl = Math.hypot(gx, gy) || 1;
    gx /= gl; gy /= gl;

    let sx = 0, sy = 0;
    const RANGE = 230;
    for (const c of ents) {
      if (c.role !== 'chaser') continue;
      const ddx = e.x - c.x, ddy = e.y - c.y;
      const d = Math.hypot(ddx, ddy) || 0.01;
      if (d >= RANGE) continue;
      const w = Math.pow((RANGE - d) / RANGE, 1.5) * 3;
      const ax = ddx / d, ay = ddy / d;
      let px = -ay, py = ax;
      if (Math.abs(px) < 0.15) {
        const s = (H / 2 - e.y) >= 0 ? 1 : -1;
        if (py * s < 0) { px = -px; py = -py; }
      } else if (px < 0) { px = -px; py = -py; }
      sx += (ax + px * 1.1) * w;
      sy += (ay + py * 1.1) * w;
    }

    let wy = 0;
    const M = 55;
    if (e.y < M) wy += (M - e.y) / M * 2;
    if (e.y > H - M) wy -= (e.y - (H - M)) / M * 2;

    let vx = gx + sx, vy = gy + sy + wy;
    const l = Math.hypot(vx, vy) || 1;
    return { dx: vx / l, dy: vy / l };
  }

  // ---------- Round resolution ----------
  function win() {
    score++;
    level++;
    flash = 1.2;
    resetRound();
  }

  function lose() {
    recordRun();
    phase = 'caught';
    phaseT = 1.6;
  }

  // ---------- Update ----------
  function update(dt) {
    if (hintT > 0) hintT -= dt;
    if (flash > 0) flash -= dt;
    if (notice.t > 0) notice.t -= dt;

    if (phase === 'ready') {
      phaseT -= dt;
      if (phaseT <= 0) phase = 'play';
      return;
    }
    if (phase === 'caught') {
      phaseT -= dt;
      if (phaseT <= 0) fullRestart();
      return;
    }

    const chaseSpeed = botSpeed();

    for (const e of ents) {
      if (e.tagFlash > 0) e.tagFlash = Math.max(0, e.tagFlash - dt);
      if (e.cd > 0) e.cd = Math.max(0, e.cd - dt);

      if (e.finished) {
        if (e.ctrl === 'ai' && e.x < e.settleX) e.x = Math.min(e.settleX, e.x + 120 * dt);
        continue;
      }

      const human = e.ctrl === 'p1' || e.ctrl === 'p2';
      let dx = 0, dy = 0, speed;

      if (human) {
        const v = inputVec(e.ctrl);
        dx = v.dx; dy = v.dy;
        speed = e.role === 'runner' ? PLAYER_SPEED : chaseSpeed;
      } else {
        if (e.role === 'chaser') {
          const n = nearestRunner(e);
          if (n && n.d > 0.001) {
            dx = (n.r.x - e.x) / n.d;
            dy = (n.r.y - e.y) / n.d;
          }
          speed = chaseSpeed;
        } else {
          const v = runnerSteer(e);
          dx = v.dx; dy = v.dy;
          speed = PLAYER_SPEED * e.speedMul;
        }
        // random dash every 4-6 seconds
        e.aiTimer -= dt;
        if (e.aiTimer <= 0 && e.dashLeft <= 0 && (dx !== 0 || dy !== 0)) {
          startDash(e, dx, dy);
          e.aiTimer = rand(4, 6);
        }
      }

      if (dx !== 0 || dy !== 0) { e.fx = dx; e.fy = dy; }

      let vx, vy;
      if (e.dashLeft > 0) {
        const ds = human ? DASH_SPEED : AI_DASH_SPEED;
        vx = e.dirX * ds; vy = e.dirY * ds;
        e.dashLeft -= dt;
        trail.push({ x: e.x, y: e.y, a: 0.5, role: e.role, ai: !human });
      } else {
        vx = dx * speed; vy = dy * speed;
      }
      e.x = Math.max(R, Math.min(W - R, e.x + vx * dt));
      e.y = Math.max(R, Math.min(H - R, e.y + vy * dt));

      // finish line
      if (e.role === 'runner' && e.x >= W - ZONE) {
        e.finished = true;
        e.dashLeft = 0;
        e.settleX = W - ZONE + 18 + Math.random() * (ZONE - 44);
        if (e.ctrl === 'p1' && cfg.multi) {
          notify('You made it safe! Waiting for the others...', '#aef6ff', 2.2);
        }
      }
    }

    for (const t of trail) t.a -= dt * 2.6;
    trail = trail.filter(t => t.a > 0);

    // ---- tagging ----
    const tags = [];
    for (const c of ents) {
      if (c.role !== 'chaser') continue;
      for (const r of ents) {
        if (r.role !== 'runner' || r.finished) continue;
        if (tags.some(t => t.r === r)) continue;
        if (Math.hypot(c.x - r.x, c.y - r.y) < CATCH_DIST) tags.push({ r, c });
      }
    }
    for (const { r, c } of tags) {
      if (c.ctrl === 'p2') chaserPts++;
      if (!cfg.multi) { lose(); return; }          // normal mode: caught = game over
      r.role = 'chaser';
      r.tagFlash = 0.7;
      r.aiTimer = rand(4, 6);
      r.dashLeft = 0;
      if (r.ctrl === 'p1') {
        notify('Tagged! You are a chaser now.', '#ff8a8a', 2.4);
      } else {
        convertedBots++;   // this bot starts every later round on the chasers' team
        if (!(notice.t > 0 && notice.color === '#ff8a8a')) {
          notify('A bot was tagged — it joins the chasers next round!', '#ffb0b0', 1.8);
        }
      }
    }

    // ---- round end ----
    const p1 = ents.find(e => e.ctrl === 'p1');
    if (!cfg.multi) {
      if (p1.finished) { win(); return; }
      return;
    }
    const active = ents.filter(e => e.role === 'runner' && !e.finished).length;
    const p1Resolved = p1.finished || p1.role === 'chaser';
    if (p1Resolved && endTimer === null) endTimer = p1.finished ? 2.0 : 20;
    if (endTimer !== null) endTimer -= dt;
    if (active === 0 || (endTimer !== null && endTimer <= 0)) {
      if (p1.finished) win(); else lose();
    }
  }

  // ---------- Drawing ----------
  function drawZones() {
    ctx.fillStyle = 'rgba(40, 130, 255, 0.45)';
    ctx.fillRect(0, 0, ZONE, H);
    ctx.fillStyle = 'rgba(255, 205, 40, 0.5)';
    ctx.fillRect(W - ZONE, 0, ZONE, H);
    const c = 18;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let y = 0; y < H; y += c) {
      for (let x = W - ZONE; x < W; x += c) {
        if (((x - (W - ZONE)) / c + y / c) % 2 === 0) ctx.fillRect(x, y, Math.min(c, W - x), c);
      }
    }
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(ZONE, 0); ctx.lineTo(ZONE, H);
    ctx.moveTo(W - ZONE, 0); ctx.lineTo(W - ZONE, H);
    ctx.stroke();

    ctx.save();
    ctx.font = 'bold 26px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.translate(ZONE / 2, H / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText('START', 0, 0);
    ctx.restore();

    ctx.save();
    ctx.font = 'bold 26px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(90,60,0,0.7)';
    ctx.fillStyle = '#fff';
    ctx.translate(W - ZONE / 2, H / 2); ctx.rotate(Math.PI / 2);
    ctx.strokeText('FINISH', 0, 0);
    ctx.fillText('FINISH', 0, 0);
    ctx.restore();
  }

  function drawBodyRaw(x, y, fill, edge, fx, fy) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x, y + R * 0.75, R * 0.95, R * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fill;
    ctx.strokeStyle = edge;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const px = -fy, py = fx;
    for (const s of [-1, 1]) {
      const ex = x + fx * 5 + px * s * 4.5;
      const ey = y + fy * 5 + py * s * 4.5;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(ex + fx * 1.3, ey + fy * 1.3, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawEntity(e) {
    let fill, edge;
    if (e.role === 'chaser') {
      fill = '#e53935';
      edge = e.ctrl === 'p1' ? '#00e5ff' : e.ctrl === 'p2' ? '#ffd24a' : '#7f0f0f';
    } else if (e.ctrl === 'p1') {
      fill = '#00e5ff'; edge = '#007c8a';
    } else {
      fill = '#7b8cff'; edge = '#2d3a9e';   // bot runners
    }
    ctx.globalAlpha = e.finished ? 0.55 : 1;
    drawBodyRaw(e.x, e.y, fill, edge, e.fx, e.fy);
    ctx.globalAlpha = 1;

    if (e.tagFlash > 0) {
      const k = 1 - e.tagFlash / 0.7;
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - k) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, R + 4 + k * 26, 0, Math.PI * 2); ctx.stroke();
    }

    if (e.label) {
      ctx.font = 'bold 11px ' + FONT;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.65)';
      ctx.strokeText(e.label, e.x, e.y - R - 7);
      ctx.fillStyle = e.ctrl === 'p1' ? '#aef6ff' : '#ffe9a6';
      ctx.fillText(e.label, e.x, e.y - R - 7);
    }
  }

  function pill(cx, cy, w, h) {
    const r = h / 2;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2 + r, cy - h / 2);
    ctx.lineTo(cx + w / 2 - r, cy - h / 2);
    ctx.arc(cx + w / 2 - r, cy, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(cx - w / 2 + r, cy + h / 2);
    ctx.arc(cx - w / 2 + r, cy, r, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();
  }

  function dashText(cx, label) {
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    pill(cx, H - 16, label.length * 8 + 22, 20);
    ctx.fillStyle = '#ff3b3b';
    ctx.fillText(label, cx, H - 12);
  }

  function cdLabel(e, prefix) {
    if (!e) return prefix + 'DASH --';
    return prefix + (e.cd > 0 ? 'DASH ' + e.cd.toFixed(1) + 's' : 'DASH READY');
  }

  function drawHUD() {
    ctx.textBaseline = 'alphabetic';

    // Back to menu button
    const hov = inRect(mouse, BACK_BTN);
    ctx.fillStyle = hov ? 'rgba(0,0,0,0.75)' : 'rgba(0,0,0,0.5)';
    roundRect(BACK_BTN.x, BACK_BTN.y, BACK_BTN.w, BACK_BTN.h, 6); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('\u25C0 Menu', BACK_BTN.x + BACK_BTN.w / 2, BACK_BTN.y + 18);

    // Left info box
    const rows = cfg.multi ? 4 : 2;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(100, 10, 180, 36 + rows * 16 - 16);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px ' + FONT;
    ctx.fillText((cfg.players === 2 ? 'Runner pts: ' : 'Points: ') + score, 110, 31);
    ctx.font = '13px ' + FONT;
    ctx.fillStyle = '#ffb0b0';
    ctx.fillText('Chaser speed: ' + Math.round(botSpeed()), 110, 51);
    if (cfg.multi) {
      const left = ents.filter(e => e.role === 'runner' && !e.finished).length;
      ctx.fillStyle = '#c8d4ff';
      ctx.fillText('Runners still out: ' + left, 110, 67);
      const chasing = ents.filter(e => e.role === 'chaser').length;
      ctx.fillStyle = '#ffb0b0';
      ctx.fillText('Chasers: ' + chasing, 110, 83);
    }

    // Right panel
    const px = W - 100 - 150, py = 10;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    if (cfg.players === 1) {
      ctx.fillRect(px, py, 150, 112);
      ctx.fillStyle = '#ffd84a';
      ctx.textAlign = 'center';
      ctx.font = 'bold 13px ' + FONT;
      ctx.fillText('LEADERBOARD', px + 75, py + 18);
      ctx.font = '13px ' + FONT;
      for (let i = 0; i < 5; i++) {
        const v = board[i];
        ctx.fillStyle = v !== undefined ? '#fff' : 'rgba(255,255,255,0.4)';
        ctx.textAlign = 'left';
        ctx.fillText((i + 1) + '.', px + 14, py + 38 + i * 15);
        ctx.textAlign = 'right';
        ctx.fillText(v !== undefined ? v + ' pts' : '\u2014', px + 136, py + 38 + i * 15);
      }
    } else {
      ctx.fillRect(px, py, 150, 70);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd84a';
      ctx.font = 'bold 13px ' + FONT;
      ctx.fillText('MATCH SCORE', px + 75, py + 18);
      ctx.font = '13px ' + FONT;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#aef6ff';
      ctx.fillText('P1 Runner', px + 12, py + 40);
      ctx.fillStyle = '#ffe9a6';
      ctx.fillText('P2 Chaser', px + 12, py + 58);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.fillText(String(score), px + 138, py + 40);
      ctx.fillText(String(chaserPts), px + 138, py + 58);
    }

    // Title + hints
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('HUSS VALLEY', W / 2, 28);

    if (hintT > 0) {
      ctx.globalAlpha = Math.min(1, hintT);
      ctx.font = '13px ' + FONT;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      if (cfg.players === 1) {
        ctx.fillText('WASD to move  \u2022  Left click or E to dash', W / 2, 50);
      } else {
        ctx.fillText('P1 runner: WASD + E / click    \u2022    P2 chaser: Arrows + Enter / Right Shift', W / 2, 50);
      }
      ctx.globalAlpha = 1;
    }

    // Dash cooldown text (small red, near the bottom)
    if (cfg.players === 1) {
      dashText(W / 2, cdLabel(ents.find(e => e.ctrl === 'p1'), ''));
    } else {
      dashText(W / 2 - 85, cdLabel(ents.find(e => e.ctrl === 'p1'), 'P1 '));
      dashText(W / 2 + 85, cdLabel(ents.find(e => e.ctrl === 'p2'), 'P2 '));
    }

    // Notices
    if (notice.t > 0) {
      ctx.globalAlpha = Math.min(1, notice.t);
      ctx.font = 'bold 18px ' + FONT;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.65)';
      ctx.textAlign = 'center';
      ctx.strokeText(notice.text, W / 2, 128);
      ctx.fillStyle = notice.color;
      ctx.fillText(notice.text, W / 2, 128);
      ctx.globalAlpha = 1;
    }
    if (endTimer !== null && endTimer > 0 && phase === 'play') {
      const p1 = ents.find(e => e.ctrl === 'p1');
      if (p1 && p1.role === 'chaser') {
        ctx.font = '13px ' + FONT;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.textAlign = 'center';
        ctx.fillText('Round ends in ' + Math.ceil(endTimer) + 's', W / 2, 150);
      }
    }
  }

  function drawCenterMessage(text, sub, color) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 54px ' + FONT;
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(text, W / 2, H / 2 - 14);
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, H / 2 - 14);
    if (sub) {
      ctx.font = 'bold 20px ' + FONT;
      ctx.lineWidth = 4;
      ctx.strokeText(sub, W / 2, H / 2 + 28);
      ctx.fillStyle = '#fff';
      ctx.fillText(sub, W / 2, H / 2 + 28);
    }
    ctx.textBaseline = 'alphabetic';
  }

  function drawGame() {
    ctx.drawImage(grass, 0, 0);
    drawZones();

    for (const t of trail) {
      ctx.globalAlpha = Math.max(0, t.a);
      ctx.fillStyle = t.role === 'chaser' ? '#ff6a6a' : (t.ai ? '#9aa8ff' : '#00e5ff');
      ctx.beginPath(); ctx.arc(t.x, t.y, R, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const order = ents.slice().sort((a, b) => a.y - b.y);
    for (const e of order) drawEntity(e);

    drawHUD();

    if (phase === 'ready') {
      drawCenterMessage(score === 0 && level === 0 ? 'GET READY' : 'LEVEL ' + (level + 1),
        cfg.multi && convertedBots > 0
          ? (convertedBots + 1) + ' chasers are hunting — and they’re getting faster...'
          : 'Chasers are getting faster...', '#ffffff');
    } else if (phase === 'caught') {
      if (cfg.players === 1) {
        drawCenterMessage('CAUGHT!', 'Final score: ' + score + '  \u2014  restarting', '#ff5252');
      } else {
        drawCenterMessage('RUNNER CAUGHT!', 'Chaser wins the round  \u2014  restarting', '#ff5252');
      }
    }
    if (flash > 0 && phase !== 'caught') {
      ctx.globalAlpha = Math.min(1, flash);
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px ' + FONT;
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText('+1 POINT  \u2022  CHASERS FASTER!', W / 2, 90);
      ctx.fillStyle = '#ffd84a';
      ctx.fillText('+1 POINT  \u2022  CHASERS FASTER!', W / 2, 90);
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    if (screen === 'menu') drawMenu();
    else drawGame();
  }

  // ---------- Scaling ----------
  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (screen === 'game') update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
