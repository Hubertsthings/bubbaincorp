<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubba incorporated™</title>
  <style>
    .overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: rgba(255, 255, 255, 0.95);
      border: 2px solid #333;
      border-radius: 10px;
      padding: 0.5px 1px;
      display: flex;
      align-items: center;
      gap: 2px;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      font-family: Arial, sans-serif;
    }
    .overlay p {
      padding: 0;
      font-size: 12px;
      border: 2px solid #ccc;
      border-radius: 4px;
      width: 140px;
      color: green;
    }
    /* Image button */
    .go-back-btn {
      width: 50px;
      height: 40px;
      background: url('https://cdn.jsdelivr.net/gh/Hubertsthings/bubbaincorp@HEAD/images/mascot.jpg') no-repeat center center;
      background-size: contain;
      border: none;
      cursor: pointer;
      padding: 0;
      border-radius: 10px;
      
    }
    .hide-btn {
      padding: 6px 5px;
      font-size: 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #dc3545;
      color: #ffffff;
       border:0px solid #333;
      border-radius: 10px;
    }
    .action-btn {
      padding: 6px 5px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #007bff;
      color: #ffffff;
      border: 1px solid #333;
    }
    .cloak-btn {
      padding: 6px 5px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #6c757d;
      color: #ffffff;
      border: 1px solid #333;
    }
    .form-btn {
      padding: 6px 5px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #17a2b8;
      color: #ffffff;
      border: 1px solid #333;
    }
    #showButton {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      padding: 6px 7px;
      font-size: 13px;
      background-color: #28a74644;
      color: #fdf9f988;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: none;
    }
  </style>
  
<title>Bubba incorporated</title>
</head>
<body>
  <canvas id="gameCanvas" width="1" height="1" style="background: lightgray;"></canvas>
  <div class="overlay" id="overlayBox">
    <button class="go-back-btn" onclick="goBack()"></button>
    <p title="go to site" >Bubba incorporated DL
    </p>
    <button class="hide-btn" onclick="hideOverlay()">Hide bar</button>
    <button class="action-btn" onclick="window.location.href='https://github.com/Hubertsthings/bigbubbalessons/releases/tag/haha'">GitHub</button>
    <button class="cloak-btn" onclick="setPageTitle()">cloak</button>
    <button class="form-btn" onclick="window.location.href='https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__ly-t9hUN0FRTVdYUUo2SVA3SVdMTFhBTlZWNU1aNS4u'">request</button>
  </div>
  <button id="showButton" onclick="showOverlay()">Bubba Inc™</button>
  <script>
    function resizeGameViewport() {
      const container = document.getElementById('gameContainer');
      const canvas = container ? container.querySelector('canvas') : null;
      if (!container || !canvas) return;

      const w = window.innerWidth;
      const h = window.innerHeight;

      container.style.width = w + 'px';
      container.style.height = h + 'px';
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }

    function goBack() {
      // Replace with your domain
      window.location.href = "https://github.com/Hubertsthings/bigbubbalessons/releases/tag/haha";
    }
    function setPageTitle() {
      document.title = '.';
    }
    function hideOverlay() {
      document.getElementById('overlayBox').style.display = 'none';
      document.getElementById('showButton').style.display = 'block';
    }
    function showOverlay() {
      document.getElementById('overlayBox').style.display = 'flex';
      document.getElementById('showButton').style.display = 'none';
    }

    window.addEventListener('resize', resizeGameViewport);
    window.addEventListener('load', resizeGameViewport);
  </script>
