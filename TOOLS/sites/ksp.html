<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<link rel="stylesheet" href="/styles.css">

<title>Lessons Online k-12</title>

<link rel="icon" type="images/png" href="/images/favicon.png">

<meta name="description" content="Bubba Inc™ provides a wide selection of educational 
lessons. These include, Algebra, English, Government, and Science.">

<style>
html,
body {
    height: 100%;
    overflow: hidden;
}

body {
    box-sizing: border-box;
}

.container {
    height: calc(100vh - 60px);
}

.lesson-frame {
    display: block;
    height: 100%;
}
</style>

</head>
<body>

<!-- launch navbar -->
<div id="navbar-container"> </div>
<script>
  function loadNavbar() {
    fetch("/navbar.html")
      .then(res => res.text())
      .then(data => {
        const navbarContainer = document.getElementById("navbar-container");
        navbarContainer.innerHTML = data;

        const navLeft = navbarContainer.querySelector(".nav-left");
        const browserNote = document.createElement("span");
        browserNote.className = "browser-note";
        browserNote.textContent = "chrome only";
        navLeft.appendChild(browserNote);

        initNavbarDropdown();
      })
      .catch(err => console.error("Navbar failed to load:", err));
}

document.addEventListener("DOMContentLoaded", loadNavbar);

</script>

<script src="/script.js"></script>

<script src="/panickey.js"></script>
<!-- end of nav bar and stuff-->


<!-- replace EXAMPLE.HTML with app in 'Apps' folder -->




<div class="container">
  <div class="lesson-controls">
    <span id="fullscreen-status" role="status" aria-live="polite"></span>
  </div>
  <iframe
    id="lesson-frame"
    src="https://algebraskills.wasmer.app/sites/ksp.html"
    class="lesson-frame"
    allow="fullscreen"
    allowfullscreen>
  </iframe>
</div>








<style>
.container {
    position: relative;
    width: 100%;
}

.lesson-controls {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
}

.browser-note {
    color: rgb(155, 152, 152);
    font-size: 14px;
    font-weight: normal;
}

#fullscreen-button {
    padding: 8px 12px;
    cursor: pointer;
}
</style>

<script>
  const lessonFrame = document.getElementById("lesson-frame");
  const fullscreenButton = document.getElementById("fullscreen-button");
  const fullscreenStatus = document.getElementById("fullscreen-status");

  fullscreenButton.addEventListener("click", async () => {
    if (!document.fullscreenEnabled || !lessonFrame.requestFullscreen) {
      fullscreenStatus.textContent = "Fullscreen is not supported by this browser.";
      return;
    }

    try {
      await lessonFrame.requestFullscreen();
      fullscreenStatus.textContent = "";
    } catch (error) {
      console.error("Could not enter fullscreen:", error);
      fullscreenStatus.textContent = "Could not enter fullscreen. An extension could be preventing action.";
    }
  });
</script>

</body>
</html>
</html>
